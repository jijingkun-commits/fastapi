version: "3.9"

# ============================================================
# RAGFlow 企业知识库 - 独立部署 (使用 Elasticsearch)
# ============================================================
# 此配置与主项目共享 PostgreSQL 和 MinIO
# 启动前请确保主项目的基础服务已启动：
#   cd /Users/jijingkun/bojxAI/fastapi && docker compose up -d
#
# 然后启动 RAGFlow：
#   cd /Users/jijingkun/bojxAI/fastapi/ragflow && docker compose up -d
# ============================================================

services:
  # Elasticsearch - 向量存储与全文检索
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: ragflow-es
    environment:
      - node.name=ragflow-es
      - cluster.name=ragflow-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-19200}:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ragflow-internal
    restart: unless-stopped

  # Redis - 缓存与会话管理
  redis:
    image: redis:7-alpine
    container_name: ragflow-redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragflow-internal
    restart: unless-stopped

  # RAGFlow 主服务
  ragflow:
    # 源码构建模式
    build:
      context: ./src_ragflow
      dockerfile: Dockerfile
    image: infiniflow/ragflow:dev
    container_name: ragflow-server
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 文档引擎：Elasticsearch
      - DOC_ENGINE=${DOC_ENGINE:-elasticsearch}
      # 数据库类型：PostgreSQL
      - DB_TYPE=postgres
      # PostgreSQL 配置（复用主项目数据库）
      - POSTGRES_HOST=fastapi-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DBNAME=ragflow
      # Elasticsearch 配置
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # MinIO（复用主项目 MinIO）
      - MINIO_HOST=fastapi-minio
      - MINIO_PORT=9000
      - MINIO_USER=admin
      - MINIO_PASSWORD=12345678
      # 时区
      - TZ=Asia/Shanghai
    ports:
      - "${RAGFLOW_PORT:-9380}:9380"
      - "${RAGFLOW_HTTP_PORT:-80}:80"
    volumes:
      - ragflow_data:/ragflow/data
      - ragflow_logs:/ragflow/logs
    restart: unless-stopped
    networks:
      - ragflow-internal
      - shared # 连接到共享网络访问 PostgreSQL 和 MinIO

volumes:
  es_data:
  redis_data:
  ragflow_data:
  ragflow_logs:


networks:
  ragflow-internal:
    driver: bridge
  # 连接到主项目创建的共享网络
  shared:
    external: true
    name: bojx-shared
