name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      # Database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
      POSTGRES_DB: chat_db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chat_db
      
      # MinIO
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD || '12345678' }}
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_API_PORT: 9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: ${{ secrets.MINIO_ROOT_PASSWORD || '12345678' }}
      
      # App Config
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_jwt_secret' }}
      MODEL_PROVIDER: qwen
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}  # REQUIRED SECRET
      
      # Frontend
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    steps:
    - uses: actions/checkout@v4

    # 1. Start Infrastructure (Postgres & MinIO)
    - name: Start Docker Services
      run: |
        docker compose up -d postgres minio minio-init
        
    - name: Wait for Services
      run: |
        # Wait for Postgres
        until docker compose exec -T postgres pg_isready -U postgres; do
          echo "Waiting for postgres..."
          sleep 2
        done
        # Wait for MinIO (simple check)
        sleep 5

    # 2. Backend Setup (FastAPI)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Backend
      run: |
        # Init DB tables using python script
        model_provider=qwen python scripts/init_tables_ci.py
        # Start uvicorn
        nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        
    - name: Wait for Backend
      run: |
        timeout 30s bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 1; done' || (cat backend.log && exit 1)

    - name: Run Backend Integration Tests
      run: |
        python test_todo_api.py

    # 3. Frontend Setup (Next.js)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./web
      run: npm ci

    - name: Start Frontend
      working-directory: ./web
      run: |
        # Wait for backend to be fully ready before starting frontend build/dev
        npm run dev -- -p 3000 > frontend.log 2>&1 &
        
    - name: Wait for Frontend
      run: |
        timeout 60s bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done' || (cat web/frontend.log && exit 1)

    # 4. Run E2E Tests
    - name: Install Playwright Browsers
      working-directory: ./web
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Tests
      working-directory: ./web
      run: npx playwright test e2e/todo_agent_stress_test.spec.cjs --project=chromium --workers 1

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: web/playwright-report/
        retention-days: 7
