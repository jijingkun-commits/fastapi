# 文档同步检查 GitHub Action
# 在 PR 中检测代码变更是否有对应文档更新

name: Doc Sync Check

on:
  pull_request:
    paths:
      - 'app/**'
      - 'web/src/**'
      - '.cursor/commands/**'
      - '.env*'
      - 'install/**'
      - 'scripts/**'
      - '.cursor/rules/**'
      - '.githooks/**'
      - 'docs/**'

jobs:
  check-doc-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check doc sync mapping
        run: |
          echo "========================================="
          echo "  文档同步强校验"
          echo "========================================="
          echo ""
          bash scripts/check_doc_sync.sh --diff-range "origin/${{ github.base_ref }}...HEAD"

      - name: Run docs_guard
        run: |
          PYTHON_BIN="$(bash scripts/repo_python.sh)"
          "$PYTHON_BIN" scripts/docs_guard.py --strict

      - name: Summary
        run: |
          echo "## 文档同步检查完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请确保代码变更有对应的文档更新。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "参考文档映射规则：\`.cursor/rules/doc_sync.mdc\`" >> $GITHUB_STEP_SUMMARY
