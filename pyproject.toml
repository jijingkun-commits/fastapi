[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-skeleton"
version = "0.1.0"
description = "FastAPI skeleton application"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.0",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]>=3.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "passlib[bcrypt]==1.7.4",
  "PyJWT==2.9.0",
  "cryptography==43.0.3",
  "python-dotenv==1.2.1",
  "colorlog==6.9.0",
  "mcp>=1.12.2",
  "openai>=1.97.0",
  "langchain==1.0.8",
  "langgraph==1.0.10",
  "langgraph-supervisor>=0.0.31",
  "langchain-openai==1.0.3",
  "langchain-deepseek>=0.1.0",
  "langchain-mcp-adapters==0.1.11",
  "langchain-community==0.4.1",
  "langchain-tavily>=0.2.0",
  "requests>=2.32.3,<3.0.0",
  "numpy==1.26.4",
  "matplotlib>=3.8.0,<4.0.0",
  "pandas>=2.2.0,<3.0.0",
  "pyyaml>=6.0.1,<7.0.0",
  "duckdb>=1.0.0,<2.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "seaborn>=0.13.2,<0.14.0",
  "pdfplumber>=0.11.3,<0.12.0",
  "python-docx>=1.1.2,<2.0.0",
  "ollama>=0.3.1,<0.4.0",
  "minio>=7.2.8,<8.0.0",
  "bs4>=0.0.2,<0.1.0",
  "mammoth>=1.9.0,<2.0.0",
  "markdownify>=0.14.1,<0.15.0",
  "pymupdf>=1.25.2,<2.0.0",
  "beautifulsoup4>=4.13.3,<5.0.0",
  "lxml>=5.3.1,<6.0.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==4.1.0",
  "httpx==0.27.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=app --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 30
show_missing = true
