[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-skeleton"
version = "0.1.0"
description = "FastAPI skeleton application"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.0",
  "SQLAlchemy==2.0.36",
  "PyMySQL==1.1.1",
  "passlib[bcrypt]==1.7.4",
  "PyJWT==2.9.0",
  "cryptography==43.0.3",
  "python-dotenv==1.2.1",
  "colorlog==6.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.27.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["app/tests"]

